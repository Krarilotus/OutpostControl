waves_interval: Feste Wartezeit zwischen Angriffswellen
waves_interval_tooltip: Der Intervall-Regler in der Ansicht „Zeit“ legt fest, wie lange der Außenposten nach einer Welle wartet, bevor er die nächste aufstellt. Bei 0 gilt die Wartezeit des Spiels.
