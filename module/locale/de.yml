defenders_group: Außenposten-Verteidiger
defenders_group_descr: Wähle direkt im Außenposten-Fenster des Karteneditors, welche Truppen einen Außenposten bewachen und wie viele es sind.
defenders_enabled: Verteidiger wählen
defenders_enabled_tooltip: |-
  Fügt dem Außenposten-Fenster eine Seite „Verteidiger“ hinzu. Klicke oben im Fenster auf den Knopf, um zwischen der Angreifer-Seite (aus dem Originalspiel) und der Verteidiger-Seite zu wechseln. Auf der Verteidiger-Seite wählen die acht Truppenknöpfe die Wachen (bei mehreren wechseln sie sich ab), und der Mengen-Regler stellt ein, wie viele rund um den Außenposten stehen (von 0 bis 50). Gefallene Wachen erscheinen einzeln neu – je höher die Anzahl, desto schneller, sodass ein voller Trupp etwa so lange braucht wie die 8 Wachen im Originalspiel. Ohne gewählte Truppe nutzt der Außenposten Bogenschützen wie im Original. Nahkampfwachen stehen auf defensiv, Sklaven auf aggressiv, Ritter sind aggressiv und patrouillieren wie berittene Bogenschützen, und berittene Bogenschützen sind aggressiv und patrouillieren über sechs zufällige Punkte um den Außenposten (bei Hindernissen auf ein freies Feld versetzt).
defenders_walls: Wachen besetzen nahe Mauern und Türme
defenders_walls_tooltip: Neue Wachen zu Fuß steigen auf Mauern, Steintürme oder steinerne Torhäuser des Außenposten-Besitzers innerhalb von 16 Feldern, sofern sie dorthin laufen können – jeweils auf das freie Feld mit den wenigsten Wachen daneben, sodass sie sich auf den Mauern verteilen und Gefallene ersetzen. Ritter und berittene Bogenschützen bleiben am Boden. Gilt für jeden Außenposten, auch ohne eigene Einstellungen.
defenders_knights: Patrouillierende Ritter greifen nahe Gebäude an
defenders_knights_tooltip: Ritter-Wachen reiten in aggressiver Haltung Patrouille um ihren Außenposten wie berittene Bogenschützen und bekämpfen feindliche Truppen unterwegs. Mit dieser Option greifen sie auch feindliche Gebäude innerhalb von 10 Feldern an und setzen danach ihre Patrouille fort.
waves_group: Wellengröße
waves_group_descr: Wie viele Truppen jede Angriffswelle eines Außenpostens enthält.
waves_exact: Genaue Truppenzahl pro Welle festlegen
waves_exact_tooltip: Der Größen-Regler auf der Angreifer-Seite legt die exakte Truppenzahl jeder Welle fest, statt der 6 Stufen zufälliger Gruppengrößen des Spiels. Er reicht von 0 (keine Wellen) bis zur größten im Spiel selbst entsandten Menge. Ohne das Modul behält die Karte die nächstgelegene Standardgröße des Spiels.
growth_group: Wellenwachstum
growth_group_descr: Wie stark die Wellen eines Außenpostens im Verlauf des Spiels anwachsen.
growth_enabled: Wachstum der Wellen festlegen
growth_enabled_tooltip: Der Regler vergr??ert jede Welle um einen Prozentsatz der ersten Welle. Bei 0 % bleibt die Gr??e gleich. Wellen wachsen bis auf 999 Truppen.
jobs_group: Aufgaben der Angreifer
jobs_group_descr: Verlässt eine Welle einen Außenposten, teilt sie sich nach Truppentyp auf und jeder Teil erhält eine passende Aufgabe. Die Werte unten bestimmen den Anteil für die erste Aufgabe; der Rest übernimmt die zweite. Katapulte und Feuerballisten haben unten eine eigene Einstellung.
jobs_enabled: Angreifern Aufgaben zuweisen
jobs_enabled_tooltip: Teilt Angriffswellen in Gruppen auf, die Gr?ben zusch?tten, Mauern angreifen, Feuerstellungen halten, andere Gruppen begleiten oder die Burg flankieren.
jobs_slaves: Sklaven, die den Burggraben zuschütten (%)
jobs_slaves_tooltip: Der Rest brennt Gebäude nieder und zerstört sie.
jobs_spearmen: Lanzenträger, die den Burggraben zuschütten (%)
jobs_spearmen_tooltip: Der Rest begleitet eine andere Gruppe.
jobs_macemen: Streitkolbentr?ger zum Flankieren (%)
jobs_macemen_tooltip: Der Rest zerstört Gebäude.
jobs_swordsmen: Schwertkämpfer gegen Mauern und Tore (%)
jobs_swordsmen_tooltip: Der Rest begleitet eine andere Gruppe.
jobs_arab_swordsmen: Arabische Schwertkämpfer gegen Mauern und Tore (%)
jobs_arab_swordsmen_tooltip: Der Rest begleitet eine andere Gruppe.
jobs_knights: Ritter zum Flankieren (%)
jobs_knights_tooltip: Flankierende Ritter versuchen, den Lord zu erreichen. Der Rest patrouilliert um die Burg.
jobs_archers: Bogensch?tzen in Feuerstellung (%)
jobs_archers_tooltip: Der Rest begleitet eine andere Gruppe.
jobs_arab_archers: Arabische Bogensch?tzen in Feuerstellung (%)
jobs_arab_archers_tooltip: Der Rest begleitet eine andere Gruppe.
jobs_slingers: Steinschleuderer zum Flankieren (%)
jobs_slingers_tooltip: Der Rest h?lt Feuerstellungen.
jobs_horse_archers: Berittene Bogenschützen auf Umrundung der Burg (%)
jobs_horse_archers_tooltip: Der Rest flankiert die Burg.
jobs_fire_throwers: Feuerwerfer zum Anzünden von Gebäuden (%)
jobs_fire_throwers_tooltip: Der Rest begleitet eine andere Gruppe.
siege_group: Belagerungsgeräte unterwegs
siege_group_descr: Katapulte und Feuerballisten aus einem Außenposten beschießen Ziele auf ihrem Weg wie die Plünderungs-Belagerungsgeräte der KI.
siege_enabled: Ziele unterwegs beschießen
siege_enabled_tooltip: Katapulte und Feuerballisten eines Außenpostens fahren Richtung Zielburg und halten zum Schießen an, sobald ein feindliches Gebäude (bei Feuerballisten zuerst feindliche Truppen) in Reichweite kommt. Das Spiel selbst bestimmt die Reichweite jedes Geräts genau wie bei Spielergeräten. Anvisiert werden nur Feinde (Spieler anderer Teams als der Außenposten-Besitzer), niemals Verbündete.
retarget_group: Nächster Gegner
retarget_group_descr: Was die Truppen eines Außenpostens tun, sobald der angegriffene Spieler besiegt ist.
retarget_enabled: Zum nächsten Gegner weiterziehen
retarget_enabled_tooltip: Jede ausgesandte Außenposten-Truppe greift einen feindlichen Spieler an. Ist dessen Lord tot, wählt die Truppe den nächsten Gegner nach Spielregel – den nächsten Feind mit noch lebendem Lord –, statt untätig stehen zu bleiben. Belagerungsgeräte beschießen ohnehin jeden Feind in Reichweite.
join_group: Außenposten verstärken die KI
join_group_descr: Wellen aus Außenposten einer KI schließen sich deren eigener Angriffsarmee an, statt allein anzugreifen.
join_enabled: Außenposten-Wellen an die KI-Angriffsarmee senden
join_enabled_tooltip: Verlässt eine Welle den Außenposten eines KI-Spielers, schließen sich ihre Truppen der Angriffsarmee dieser KI in der spielüblichen Gruppe an – Bogenschützen, Armbrustschützen, Steinschleuderer, berittene Bogenschützen und Feuerwerfer den Reservetruppen, alle anderen der Hauptarmee. Sie warten auf den nächsten KI-Angriff, kämpfen mit und zählen zur nötigen Angriffsgröße. Belagerungsgeräte bleiben beim Außenposten und feuern auf Ziele in Reichweite. Einheiten ohne passende KI-Truppe greifen weiter vom Außenposten aus an.
diagnostics_group: Diagnose
diagnostics_group_descr: Für Tests und Fehlersuche.
diagnostics_log: Wellenverhalten protokollieren
diagnostics_log_tooltip: Schreibt eine Zeile in ucp3.log, sobald eine Welle einen Außenposten verlässt und in Aufgaben aufgeteilt wird.
