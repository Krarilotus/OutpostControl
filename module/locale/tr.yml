waves_interval_tooltip: |-
  Zamanlama görünümündeki Aralık kaydırıcısı, karakolun bir dalgadan sonra bir sonrakini oluşturmadan önce ne kadar bekleyeceğini belirler. Oyunun kendi zamanlaması için 0 yapın.
