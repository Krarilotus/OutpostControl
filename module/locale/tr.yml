defenders_group: Karakol savunucuları
defenders_enabled: Savunucuları seç
defenders_enabled_tooltip: |-
  Karakol paneline bir Savunucular sayfası ekler. Saldıranlar sayfası (oyunun kendi sayfası) ile Savunucular sayfası arasında geçiş yapmak için panelin üstündeki düğmeye tıklayın. Savunucular sayfasındaki sekiz birlik düğmesi muhafızları belirler (birden fazla seçerseniz sırayla üretilirler) ve Miktar kaydırıcısı karakolun çevresinde kaç muhafız duracağını 0 ile 50 arasında ayarlar. Ölen muhafızlar tek tek geri gelir; sayı ne kadar yüksekse o kadar hızlı yenilenirler, böylece tam bir ekip oyunun varsayılan 8 muhafızıyla yaklaşık aynı sürede tamamlanır. Hiçbir birlik seçilmezse karakol oyundaki gibi okçuları kullanır. Yakın dövüş muhafızları savunma duruşunda bekler, köleler saldırgan duruştadır, şövalyeler saldırgan duruşta atlı okçular gibi devriye gezer ve atlı okçular da saldırgan duruşta karakolun çevresinde rastgele altı nokta boyunca devriye gezer; yollarına bir engel çıkarsa her nokta boş bir yere kaydırılır.
defenders_walls: Muhafızlar yakındaki surlara ve kulelere çıksın
defenders_walls_tooltip: |-
  Yeni bir yaya muhafız, yürüyerek ulaşabiliyorsa karakolun 16 kare yakınındaki karakol sahibine ait surlara, taş kulelere veya taş kapı binalarına çıkar ve çevresinde en az muhafız bulunan boş noktaya yerleşir; böylece surlara yayılır ve ölen muhafızların yerini doldururlar. Şövalyeler ve atlı okçular yerde kalır. Ayar yapılmamış olanlar dâhil tüm karakollar için geçerlidir.
defenders_knights: Devriye gezen şövalyeler yakındaki binalara saldırsın
defenders_knights_tooltip: |-
  Şövalye muhafızlar atlı okçular gibi saldırgan duruşta karakollarının çevresinde devriye gezer ve karşılaştıkları düşman birliklerle savaşır. Bu ayar açıkken 10 kare mesafelerine giren düşman binalarına da saldırır, bina yıkılınca devriyelerine geri dönerler.
waves_group: Dalga ayarları
waves_group_descr: |-
  Bir karakolun her dalgasında kaç birlik bulunacağını belirler.
waves_exact: Dalga başına kesin birlik sayısını ayarla
waves_exact_tooltip: |-
  Karakol panelinin Saldıranlar sayfasındaki Boyut kaydırıcısı, oyunun rastgele grup boyutlarından oluşan 6 kademesi yerine her dalgada tam olarak kaç birlik olacağını belirler. Dalgaları tamamen kapatan 0 değerinden, oyunun en büyük boyutunda gönderdiği azami sayıya kadar uzanır. Bu modül olmadan harita, oyunun kendi boyutlarından en yakın olanını korur.
growth_group: Dalga büyümesi
growth_group_descr: |-
  Oyun ilerledikçe bir karakolun dalgalarının ne kadar büyüyeceğini belirler.
growth_enabled: Dalgaların ne kadar büyüyeceğini seç
growth_enabled_tooltip: |-
  Büyüme, ilk dalga boyutunun belirli bir yüzdesini sonraki her dalgaya ekler. %0 değerinde her dalga aynı boyutta kalır. Dalgalar 999 birlikte büyümeyi durdurur.
jobs_group: Saldıranların görevleri
jobs_enabled: Saldıranlara görev ver
jobs_enabled_tooltip: |-
  Karakol dalgalarını hendek dolduran, surları yaran, atış mevzilerini tutan, başka bir gruba eşlik eden veya kaleye yandan saldıran gruplara böler.
siege_enabled: Yol üzerindeki hedeflere ateş et
siege_enabled_tooltip: |-
  Karakoldan çıkan mancınıklar ve ateş balistaları saldırdıkları kaleye doğru ilerler ve menzile bir düşman binası (ateş balistaları için önce düşman birlikleri) girer girmez durup ateş eder. Neyin menzilde olduğuna, her aracın kendi menziline göre, oyuncunun araçlarında olduğu gibi oyunun kendisi karar verir. Yalnızca düşmanlar hedef alınır: karakol sahibinden farklı takımdaki oyuncular; müttefiklere asla ateş edilmez.
retarget_enabled: Sonraki rakibe yönel
retarget_enabled_tooltip: |-
  Karakolun gönderdiği her birlik bir düşman oyuncuyu hedef alır. O oyuncunun lordu öldüğünde birlik boş boş beklemek yerine, oyunun ilk hedefi seçtiği yolla — lordu hâlâ hayatta olan en yakın düşman — sonraki rakibi seçer. Kuşatma araçları zaten menzillerindeki herhangi bir düşmana ateş eder.
join_enabled: Karakol dalgalarını yapay zekânın saldırı ordusuna gönder
join_enabled_tooltip: |-
  Bir yapay zekâ oyuncusunun karakolundan bir dalga ayrıldığında birlikleri o yapay zekânın saldırı ordusuna katılır; her biri oyunun o birlik için kullanacağı gruba girer: okçular, arbaletçiler, sapancılar, atlı okçular ve ateş atıcılar destek birliklerine, diğer herkes ana orduya. Ardından yapay zekânın sonraki saldırısını bekleyip o saldırıda savaşırlar ve yapay zekânın saldırmadan önce beklediği ordu sayısına dâhil olurlar. Kuşatma araçları karakolda kalıp erişebildikleri hedeflere ateş eder. Yapay zekânın henüz ilgili grubu olmayan bir birlik karakoldan saldırmaya devam eder.
