defenders_group: Защитники аванпоста
defenders_group_descr: Выбирайте, какие войска и в каком количестве охраняют аванпост, прямо на панели аванпоста в редакторе карт.
defenders_enabled: Выбор защитников
defenders_enabled_tooltip: |-
  Добавляет вкладку «Защитники» на панель аванпоста. Кнопка вверху панели переключает между страницей атакующих (из игры) и защитников. На странице защитников восемь кнопок войск задают состав охраны (если выбрать несколько, они чередуются), а ползунок количества задаёт от 0 до 50 охранников. Погибшие возвращаются по одному, тем быстрее, чем их больше, чтобы полный отряд восстанавливался примерно за то же время, что и 8 стандартных. Если ничего не выбрано, используются лучники. Пехота ближнего боя стоит в оборонительной стойке, рабы — в агрессивной, рыцари патрулируют в агрессивной стойке как конные лучники, а конные лучники патрулируют вокруг аванпоста по шести случайным точкам (смещаясь на свободную клетку при препятствиях).
defenders_walls: Охрана занимает ближайшие стены и башни
defenders_walls_tooltip: Новые пешие охранники поднимаются на стены, каменные башни или каменные ворота владельца аванпоста в пределах 16 клеток, если могут туда дойти — на свободную клетку с наименьшим числом охраны вокруг, равномерно распределяясь и заменяя погибших. Рыцари и конные лучники остаются на земле. Работает для всех аванпостов, даже без настроек.
defenders_knights: Патрулирующие рыцари атакуют ближайшие здания
defenders_knights_tooltip: Охраняющие рыцари патрулируют вокруг аванпоста в агрессивной стойке, как конные лучники, и сражаются со встреченными врагами. С этой опцией они также атакуют вражеские здания в пределах 10 клеток, а после разрушения продолжают патруль.
waves_group: Размер волны
waves_group_descr: Сколько войск выходит в каждой волне аванпоста.
waves_exact: Задавать точное число войск в волне
waves_exact_tooltip: Ползунок «Размер» на странице атакующих задаёт точное количество войск в волне вместо 6 ступеней случайных размеров игры. Диапазон от 0 (отключить волны) до максимального размера в игре. Без модуля карта сохраняет ближайший стандартный размер игры.
growth_group: Рост волн
growth_group_descr: Насколько крупнее становятся волны аванпоста по ходу игры.
growth_enabled: Настраивать рост волн
growth_enabled_tooltip: Ползунок «Рост» на странице атакующих (под размером и задержкой старта) задаёт, на сколько процентов от первой волны каждая волна больше предыдущей. 0 сохраняет размер первой волны как в оригинале; 50 добавляет половину первой волны каждый раз; 100 добавляет целую первую волну (3-я волна втрое больше первой). Рост ограничен 999 воинами и лимитом армии игры. Частота волн остаётся как в игре.
jobs_group: Задачи атакующих
jobs_group_descr: Выходя из аванпоста, волна делится по типам войск, и каждая часть получает подходящую задачу. Значения ниже задают долю для первой задачи; остальные выполняют вторую. Катапульты и огненные баллисты настраиваются ниже.
jobs_enabled: Распределять задачи атакующим
jobs_enabled_tooltip: |-
  Без этого вся волна делает одно: идёт ломать здание, изредка копая ров. С опцией волна делится на засыпающих ров, ломающих стены и ворота, поджигающих и крушащих здания, обстреливающих врагов, объезжающих замок и охотящихся на лорда. Отряд без оставшихся целей (ров засыпан, стен нет) атакует как обычная волна.
jobs_slaves: Рабы, засыпающие ров (%)
jobs_slaves_tooltip: Остальные поджигают и разрушают здания.
jobs_spearmen: Копейщики, засыпающие ров (%)
jobs_spearmen_tooltip: Остальные ломают стены и ворота.
jobs_macemen: Булавоносцы, засыпающие ров (%)
jobs_macemen_tooltip: Остальные разрушают здания.
jobs_swordsmen: Мечники, атакующие стены и ворота (%)
jobs_swordsmen_tooltip: Остальные разрушают здания.
jobs_arab_swordsmen: Арабские мечники, атакующие стены и ворота (%)
jobs_arab_swordsmen_tooltip: Остальные разрушают здания.
jobs_knights: Рыцари, охотящиеся на лорда (%)
jobs_knights_tooltip: Остальные объезжают замок и рубят всех за стенами. Если к лорду не добраться, охотники тоже объезжают замок.
jobs_archers: Лучники, засыпающие ров (%)
jobs_archers_tooltip: Остальные подходят и обстреливают встреченные войска.
jobs_arab_archers: Арабские лучники, засыпающие ров (%)
jobs_arab_archers_tooltip: Остальные подходят и обстреливают встреченные войска.
jobs_slingers: Пращники, обходящие замок (%)
jobs_slingers_tooltip: Они обходят замок и обстреливают всех за стенами. Остальные подходят и стреляют по встреченным войскам.
jobs_horse_archers: Конные лучники, объезжающие замок (%)
jobs_horse_archers_tooltip: Они объезжают замок и обстреливают всех за стенами. Остальные подходят и стреляют по встреченным войскам.
jobs_fire_throwers: Огнеметатели, поджигающие здания (%)
jobs_fire_throwers_tooltip: Остальные подходят и сжигают встреченные войска.
siege_group: Осадные орудия в пути
siege_group_descr: Катапульты и огненные баллисты аванпоста стреляют по целям по пути, как осадные орудия налётов ИИ.
siege_enabled: Обстреливать цели по пути
siege_enabled_tooltip: Катапульты и огненные баллисты аванпоста движутся к целевому замку и останавливаются для огня, как только в радиус попадает вражеское здание (для баллист сначала вражеские войска). Радиус определяется самой игрой. Целями выбираются только враги другой команды, никогда союзники.
retarget_group: Следующий противник
retarget_group_descr: Что делают войска аванпоста после поражения целевого игрока.
retarget_enabled: Переходить к следующему противнику
retarget_enabled_tooltip: Каждый отряд аванпоста идёт на одного врага. После гибели его лорда отряд выбирает следующего противника по правилам игры — ближайшего врага с живым лордом — вместо простоя. Осадные орудия и так стреляют по любому врагу в радиусе.
join_group: Аванпосты усиливают ИИ
join_group_descr: Волны из аванпостов ИИ присоединяются к его атакующей армии вместо самостоятельных атак.
join_enabled: Отправлять волны аванпостов в атакующую армию ИИ
join_enabled_tooltip: Когда волна покидает аванпост игрока ИИ, войска вливаются в его атакующую армию по штатным группам (стрелки — в резерв, остальные — в основную армию), ждут следующей атаки ИИ и засчитываются в её размер. Осадные орудия остаются у аванпоста. Юнит без подходящего отряда у ИИ продолжает атаковать из аванпоста.
diagnostics_group: Диагностика
diagnostics_group_descr: Для тестирования.
diagnostics_log: Записывать действия волн в журнал
diagnostics_log_tooltip: Записывает строку в ucp3.log каждый раз, когда волна выходит из аванпоста и распределяется по задачам.
wave_rule: Правило волны
wave_setting: Настройка
wave_details: Настройте правила волн, доступные авторам карт. Размер волны, задержка старта и процент роста задаются на странице атакующих каждого аванпоста.
job_unit: Юнит
job_share: Первая задача (%)
improvements: Улучшения
misc: Разное
balance_changes: Изменения баланса
ai: ИИ
