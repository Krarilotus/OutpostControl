defenders_group: Защитники аванпоста
defenders_enabled: Выбор защитников
defenders_enabled_tooltip: |-
  Добавляет вкладку «Защитники» на панель аванпоста. Кнопка вверху панели переключает между страницей атакующих (из игры) и защитников. На странице защитников восемь кнопок войск задают состав охраны (если выбрать несколько, они чередуются), а ползунок количества задаёт от 0 до 50 охранников. Погибшие возвращаются по одному, тем быстрее, чем их больше, чтобы полный отряд восстанавливался примерно за то же время, что и 8 стандартных. Если ничего не выбрано, используются лучники. Пехота ближнего боя стоит в оборонительной стойке, рабы — в агрессивной, рыцари патрулируют в агрессивной стойке как конные лучники, а конные лучники патрулируют вокруг аванпоста по шести случайным точкам (смещаясь на свободную клетку при препятствиях).
defenders_walls: Охрана занимает ближайшие стены и башни
defenders_walls_tooltip: Новые пешие охранники поднимаются на стены, каменные башни или каменные ворота владельца аванпоста в пределах 16 клеток, если могут туда дойти — на свободную клетку с наименьшим числом охраны вокруг, равномерно распределяясь и заменяя погибших. Рыцари и конные лучники остаются на земле. Работает для всех аванпостов, даже без настроек.
defenders_knights: Патрулирующие рыцари атакуют ближайшие здания
defenders_knights_tooltip: Охраняющие рыцари патрулируют вокруг аванпоста в агрессивной стойке, как конные лучники, и сражаются со встреченными врагами. С этой опцией они также атакуют вражеские здания в пределах 10 клеток, а после разрушения продолжают патруль.
waves_group: Настройки волн
waves_group_descr: Сколько войск выходит в каждой волне аванпоста.
waves_exact: Задавать точное число войск в волне
waves_exact_tooltip: Ползунок «Размер» на странице атакующих задаёт точное количество войск в волне вместо 6 ступеней случайных размеров игры. Диапазон от 0 (отключить волны) до максимального размера в игре. Без модуля карта сохраняет ближайший стандартный размер игры.
growth_group: Рост волн
growth_group_descr: Насколько крупнее становятся волны аванпоста по ходу игры.
growth_enabled: Настраивать рост волн
growth_enabled_tooltip: Рост добавляет процент от размера первой волны к каждой следующей волне. При 0% все волны остаются одного размера. Рост останавливается на 999 воинах.
jobs_group: Задачи атакующих
jobs_enabled: Распределять задачи атакующим
jobs_enabled_tooltip: Делит волны аванпоста на отряды, которые засыпают рвы, пробивают стены, удерживают огневые позиции, сопровождают другой отряд или обходят замок с фланга.
siege_enabled: Обстреливать цели по пути
siege_enabled_tooltip: Катапульты и огненные баллисты аванпоста движутся к целевому замку и останавливаются для огня, как только в радиус попадает вражеское здание (для баллист сначала вражеские войска). Радиус определяется самой игрой. Целями выбираются только враги другой команды, никогда союзники.
retarget_enabled: Переходить к следующему противнику
retarget_enabled_tooltip: Каждый отряд аванпоста идёт на одного врага. После гибели его лорда отряд выбирает следующего противника по правилам игры — ближайшего врага с живым лордом — вместо простоя. Осадные орудия и так стреляют по любому врагу в радиусе.
join_enabled: Отправлять волны аванпостов в атакующую армию ИИ
join_enabled_tooltip: Когда волна покидает аванпост игрока ИИ, войска вливаются в его атакующую армию по штатным группам (стрелки — в резерв, остальные — в основную армию), ждут следующей атаки ИИ и засчитываются в её размер. Осадные орудия остаются у аванпоста. Юнит без подходящего отряда у ИИ продолжает атаковать из аванпоста.
