defenders_group: Défenseurs d'avant-poste
defenders_group_descr: Choisissez quelles troupes gardent un avant-poste et en quel nombre, directement dans le panneau de l'avant-poste dans l'éditeur de cartes.
defenders_enabled: Choisir les défenseurs
defenders_enabled_tooltip: |-
  Ajoute un onglet Défenseurs au panneau de l'avant-poste. Cliquez sur le bouton en haut du panneau pour basculer entre la page Attaquants (d'origine) et la page Défenseurs. Sur celle-ci, les huit boutons d'unités choisissent les gardes (en choisir plusieurs les fait alterner) et le curseur Quantité règle leur nombre de 0 à 50. Les gardes tombés reviennent un par un, plus vite selon le nombre défini afin qu'un groupe complet se reconstitue dans le même temps que les 8 du jeu d'origine. Sans unité choisie, l'avant-poste utilise des archers. Les gardes de mêlée sont en posture défensive, les esclaves en agressive, les chevaliers patrouillent en agressive comme les archers montés, et les archers montés patrouillent autour de l'avant-poste sur six points aléatoires déplacés sur une case libre en cas d'obstacle.
defenders_walls: Les gardes occupent les murs et tours proches
defenders_walls_tooltip: Un nouveau garde à pied monte sur les murs, tours en pierre ou portes en pierre du propriétaire dans un rayon de 16 cases s'il peut y accéder, en choisissant la case libre la moins gardée pour se répartir et remplacer les morts. Les chevaliers et archers montés restent au sol. Fonctionne pour tout avant-poste, même sans réglage personnalisé.
defenders_knights: Les chevaliers en patrouille attaquent les bâtiments proches
defenders_knights_tooltip: Les chevaliers gardes patrouillent autour de leur avant-poste en posture agressive comme les archers montés et combattent les troupes ennemies. Avec cette option, ils attaquent aussi les bâtiments ennemis dans un rayon de 10 cases puis reprennent leur patrouille une fois le bâtiment détruit.
waves_group: Taille des vagues
waves_group_descr: Nombre de troupes dans chaque vague d'un avant-poste.
waves_exact: Définir le nombre exact de troupes par vague
waves_exact_tooltip: Le curseur Taille sur la page Attaquants règle le nombre exact de troupes par vague au lieu des 6 paliers aléatoires du jeu. Il va de 0 (aucune vague) jusqu'au maximum envoyé par le jeu. Sans le module, la carte conserve le palier d'origine le plus proche.
growth_group: Croissance des vagues
growth_group_descr: De combien les vagues d'un avant-poste grossissent au fil de la partie.
growth_enabled: Choisir la croissance des vagues
growth_enabled_tooltip: Le curseur Croissance sur la page Attaquants, sous Taille et Délai initial, définit l'augmentation de chaque vague par rapport à la précédente en pourcentage de la première vague. 0 garde toutes les vagues identiques à la première ; 50 ajoute la moitié de la première vague à chaque fois ; 100 ajoute une première vague entière (la 3e vague est trois fois plus grande). La croissance s'arrête à 999 troupes, dans la limite d'armée du jeu. La fréquence reste celle du jeu.
jobs_group: Rôles des attaquants
jobs_group_descr: Quand une vague quitte un avant-poste, ses troupes se divisent par type et reçoivent un rôle adapté. Les nombres ci-dessous fixent la part prenant le premier rôle ; le reste prend le second. Catapultes et balistes incendiaires ont leur réglage ci-dessous.
jobs_enabled: Attribuer des rôles aux attaquants
jobs_enabled_tooltip: |-
  Sans cela, toute la vague fait la même chose : avancer attaquer un bâtiment et parfois creuser les douves. Avec cette option, la vague se répartit entre combler les douves, frapper murs et portes, incendier et détruire les bâtiments, tirer sur les troupes, contourner le château ou chasser le seigneur. Une troupe sans tâche restante attaque normalement.
jobs_slaves: Esclaves comblant les douves (%)
jobs_slaves_tooltip: Le reste incendie et détruit les bâtiments.
jobs_spearmen: Lanciers comblant les douves (%)
jobs_spearmen_tooltip: Le reste frappe les murs et les portes.
jobs_macemen: Massiers comblant les douves (%)
jobs_macemen_tooltip: Le reste détruit les bâtiments.
jobs_swordsmen: Épéistes attaquant murs et portes (%)
jobs_swordsmen_tooltip: Le reste détruit les bâtiments.
jobs_arab_swordsmen: Épéistes arabes attaquant murs et portes (%)
jobs_arab_swordsmen_tooltip: Le reste détruit les bâtiments.
jobs_knights: Chevaliers chassant le seigneur (%)
jobs_knights_tooltip: Le reste chevauche autour du château et abat quiconque se trouve hors des murs. Si le seigneur est inaccessible, les chasseurs contournent aussi le château.
jobs_archers: Archers comblant les douves (%)
jobs_archers_tooltip: Le reste avance et tire sur les troupes rencontrées.
jobs_arab_archers: Archers arabes comblant les douves (%)
jobs_arab_archers_tooltip: Le reste avance et tire sur les troupes rencontrées.
jobs_slingers: Frondeurs contournant le château (%)
jobs_slingers_tooltip: Ils contournent le château et tirent sur ceux hors des murs. Le reste avance et tire sur les troupes rencontrées.
jobs_horse_archers: Archers montés contournant le château (%)
jobs_horse_archers_tooltip: Ils chevauchent autour du château et tirent sur ceux hors des murs. Le reste avance et tire sur les troupes rencontrées.
jobs_fire_throwers: Lanceurs de feu incendiant les bâtiments (%)
jobs_fire_throwers_tooltip: Le reste avance et brûle les troupes rencontrées.
siege_group: Engins de siège en chemin
siege_group_descr: Les catapultes et balistes incendiaires d'un avant-poste tirent sur ce qu'elles croisent, comme les engins de raid de l'IA.
siege_enabled: Tirer sur les cibles en chemin
siege_enabled_tooltip: Les catapultes et balistes incendiaires d'un avant-poste avancent vers le château cible et s'arrêtent pour tirer dès qu'un bâtiment ennemi (ou troupes ennemies d'abord pour les balistes) entre à portée selon la portée propre de chaque engin. Seuls les ennemis d'une autre équipe sont visés, jamais les alliés.
retarget_group: Adversaire suivant
retarget_group_descr: Comportement des troupes d'un avant-poste une fois le joueur ciblé vaincu.
retarget_enabled: Passer à l'adversaire suivant
retarget_enabled_tooltip: Chaque troupe sortie d'un avant-poste vise un joueur ennemi. Une fois son seigneur mort, elle choisit l'adversaire suivant comme le jeu choisit le premier — l'ennemi le plus proche dont le seigneur vit encore — au lieu de rester inactive. Les engins de siège tirent déjà sur tout ennemi à portée.
join_group: Les avant-postes renforcent l'IA
join_group_descr: Les vagues des avant-postes d'une IA rejoignent son armée d'attaque au lieu d'attaquer seules.
join_enabled: Envoyer les vagues d'avant-poste à l'armée d'attaque de l'IA
join_enabled_tooltip: Quand une vague quitte un avant-poste d'un joueur IA, ses troupes rejoignent son armée d'attaque dans leur groupe habituel — archers, arbalétriers, frondeurs, archers montés et lanceurs de feu en renfort, tous les autres dans l'armée principale — et attendent l'attaque suivante de l'IA. Les engins de siège restent à l'avant-poste. Une unité sans groupe correspondant continue d'attaquer depuis l'avant-poste.
diagnostics_group: Diagnostic
diagnostics_group_descr: Pour les tests et le dépannage.
diagnostics_log: Journaliser l'activité des vagues
diagnostics_log_tooltip: Écrit une ligne dans ucp3.log chaque fois qu'une vague quitte un avant-poste et se répartit en rôles.
wave_rule: Règle de vague
wave_setting: Réglage
wave_details: Configurez les règles de vague disponibles pour les auteurs de cartes. Taille, délai initial et croissance en pourcentage s'éditent sur la page Attaquants de chaque avant-poste.
job_unit: Unité
job_share: Premier rôle (%)
improvements: Améliorations
misc: Divers
balance_changes: Modifications de l'équilibrage
ai: IA
panel_attackers: Attaquants
panel_defenders: Défenseurs
panel_growth: Croissance
panel_amount: Quantité
