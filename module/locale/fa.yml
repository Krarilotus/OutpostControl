defenders_group: مدافعان پایگاه مرزی
defenders_group_descr: |-
  در ویرایشگر نقشه، از پنل خود پایگاه مرزی انتخاب کنید کدام نیروها و به چه تعداد از آن محافظت کنند.
defenders_enabled: انتخاب مدافعان
defenders_enabled_tooltip: |-
  یک صفحهٔ «مدافعان» به پنل پایگاه مرزی اضافه می‌کند. روی دکمهٔ بالای پنل کلیک کنید تا میان صفحهٔ «مهاجمان» (صفحهٔ خود بازی) و صفحهٔ «مدافعان» جابه‌جا شوید. در صفحهٔ مدافعان، هشت دکمهٔ نیرو نوع نگهبانان را تعیین می‌کنند (با انتخاب چند نیرو، به‌نوبت ساخته می‌شوند) و لغزندهٔ تعداد مشخص می‌کند از صفر تا ۵۰ نگهبان پیرامون پایگاه بایستند. نگهبانان کشته‌شده یکی‌یکی جایگزین می‌شوند؛ هرچه تعداد بیشتری تعیین کنید سریع‌تر برمی‌گردند، به‌طوری که جایگزینی کل گروه تقریباً به‌اندازهٔ ۸ نگهبان پیش‌فرض بازی زمان می‌برد. اگر هیچ نیرویی انتخاب نشود، پایگاه مثل خود بازی از کمانداران استفاده می‌کند. نگهبانان نبرد تن‌به‌تن در حالت دفاعی می‌ایستند، بردگان در حالت تهاجمی هستند، شوالیه‌ها در حالت تهاجمی مانند کمانداران سواره گشت‌زنی می‌کنند و کمانداران سواره نیز در حالت تهاجمی گرداگرد پایگاه از میان شش نقطهٔ تصادفی گشت می‌زنند که در صورت وجود مانع، هر نقطه به جای خالی منتقل می‌شود.
defenders_walls: استقرار نگهبانان روی دیوارها و برج‌های نزدیک
defenders_walls_tooltip: |-
  هر نگهبان پیادهٔ جدید، اگر مسیر پیاده باز باشد، روی دیوارها، برج‌های سنگی یا دروازه‌های سنگی مالک پایگاه در شعاع ۱۶ خانه‌ای آن می‌رود و به نقطهٔ خالی‌ای می‌رود که کمترین نگهبان در اطرافش است؛ در نتیجه روی دیوارها پخش می‌شوند و جای نگهبانان کشته‌شده را پر می‌کنند. شوالیه‌ها و کمانداران سواره روی زمین می‌مانند. برای همهٔ پایگاه‌های مرزی، حتی آن‌هایی که تنظیماتی ندارند، کار می‌کند.
defenders_knights: حملهٔ شوالیه‌های گشت‌زن به ساختمان‌های نزدیک
defenders_knights_tooltip: |-
  شوالیه‌های نگهبان مانند کمانداران سواره در حالت تهاجمی پیرامون پایگاه خود گشت‌زنی می‌کنند و با نیروهای دشمنی که می‌بینند می‌جنگند. با فعال بودن این گزینه، به ساختمان‌های دشمنی هم که تا ۱۰ خانه‌ای آن‌ها قرار گیرند حمله می‌کنند و پس از نابودی ساختمان به گشت‌زنی برمی‌گردند.
waves_group: اندازهٔ موج
waves_group_descr: |-
  تعداد نیروها در هر موج حملهٔ یک پایگاه مرزی.
waves_exact: تعیین تعداد دقیق نیروها در هر موج
waves_exact_tooltip: |-
  لغزندهٔ «اندازه» در صفحهٔ مهاجمانِ پنل پایگاه مرزی، به‌جای ۶ پلهٔ تصادفی خود بازی، دقیقاً مشخص می‌کند هر موج چند نیرو داشته باشد؛ از ۰ (که موج‌های پایگاه را خاموش می‌کند) تا بیشترین تعدادی که خود بازی در بزرگ‌ترین اندازه می‌فرستد. بدون این ماژول، نقشه نزدیک‌ترین اندازهٔ خود بازی را نگه می‌دارد.
growth_group: رشد موج‌ها
growth_group_descr: |-
  میزان بزرگ‌تر شدن موج‌های پایگاه مرزی در طول بازی.
growth_enabled: انتخاب میزان رشد موج‌ها
growth_enabled_tooltip: |-
  لغزندهٔ «رشد» در صفحهٔ مهاجمانِ پنل پایگاه مرزی، زیر «اندازه» و «تأخیر شروع»: مشخص می‌کند هر موج نسبت به موج قبلی به‌اندازهٔ چند درصد از موج اول بزرگ‌تر شود. مقدار ۰ همهٔ موج‌ها را مانند خود بازی هم‌اندازهٔ موج اول نگه می‌دارد؛ ۵۰ هر بار نیمی از موج اول را اضافه می‌کند؛ ۱۰۰ هر بار یک موج اول کامل اضافه می‌کند (موج سوم سه برابر موج اول می‌شود). رشد موج‌ها در ۹۹۹ نیرو متوقف می‌شود و بازی همچنان بیش از سقف ارتش نیرو نمی‌فرستد. سرعت آمدن موج‌ها مانند خود بازی می‌ماند: پس از هر موج کمی زودتر.
jobs_group: وظایف مهاجمان
jobs_group_descr: |-
  وقتی موجی از پایگاه مرزی خارج می‌شود، نیروهایش بر اساس نوع جدا می‌شوند و هر بخش وظیفهٔ متناسب با خود را می‌گیرد. عددهای زیر نشان می‌دهند چه درصدی از هر نوع وظیفهٔ اول را بر عهده می‌گیرند؛ بقیه وظیفهٔ دوم را انجام می‌دهند. منجنیق‌ها و بالیستاهای آتشین تنظیم جداگانه‌ای در پایین دارند.
jobs_enabled: تعیین وظیفه برای مهاجمان
jobs_enabled_tooltip: |-
  بدون این گزینه، کل موج یک کار انجام می‌دهد: پیش می‌رود و به یک ساختمان حمله می‌کند و گاهی خندق را می‌کند. با فعال شدن آن، موج به نیروهایی تقسیم می‌شود که خندق را پر می‌کنند، به دیوارها و دروازه‌ها یورش می‌برند، ساختمان‌ها را می‌سوزانند و ویران می‌کنند، به نیروهای سر راه تیراندازی می‌کنند، گرداگرد قلعه می‌چرخند یا لرد را شکار می‌کنند. نیرویی که در وظیفه‌اش کاری باقی نمانده باشد (خندق پر شده یا دیواری سر راه نباشد) مانند کل موج به حمله ادامه می‌دهد.
jobs_slaves: بردگانِ پرکنندهٔ خندق (%)
jobs_slaves_tooltip: |-
  بقیه ساختمان‌ها را می‌سوزانند و ویران می‌کنند.
jobs_spearmen: نیزه‌دارانِ پرکنندهٔ خندق (%)
jobs_spearmen_tooltip: |-
  بقیه به دیوارها و دروازه‌ها حمله می‌کنند.
jobs_macemen: گرزدارانِ پرکنندهٔ خندق (%)
jobs_macemen_tooltip: |-
  بقیه ساختمان‌ها را ویران می‌کنند.
jobs_swordsmen: شمشیرزنانِ مهاجم به دیوارها و دروازه‌ها (%)
jobs_swordsmen_tooltip: |-
  بقیه ساختمان‌ها را ویران می‌کنند.
jobs_arab_swordsmen: شمشیرزنان عربِ مهاجم به دیوارها و دروازه‌ها (%)
jobs_arab_swordsmen_tooltip: |-
  بقیه ساختمان‌ها را ویران می‌کنند.
jobs_knights: شوالیه‌های شکارچی لرد (%)
jobs_knights_tooltip: |-
  بقیه گرداگرد قلعه می‌تازند و هرکس بیرون دیوارها باشد از پا درمی‌آورند. وقتی دسترسی به لرد ممکن نباشد، شکارچیان هم گرداگرد قلعه می‌چرخند.
jobs_archers: کماندارانِ پرکنندهٔ خندق (%)
jobs_archers_tooltip: |-
  بقیه پیش می‌روند و به نیروهای دشمنِ سر راه تیراندازی می‌کنند.
jobs_arab_archers: کمانداران عربِ پرکنندهٔ خندق (%)
jobs_arab_archers_tooltip: |-
  بقیه پیش می‌روند و به نیروهای دشمنِ سر راه تیراندازی می‌کنند.
jobs_slingers: فلاخن‌اندازانِ چرخنده گرداگرد قلعه (%)
jobs_slingers_tooltip: |-
  پیاده گرداگرد قلعه می‌چرخند و به هرکس بیرون دیوارها باشد سنگ می‌اندازند. بقیه پیش می‌روند و به نیروهای سر راه تیراندازی می‌کنند.
jobs_horse_archers: کمانداران سوارهٔ چرخنده گرداگرد قلعه (%)
jobs_horse_archers_tooltip: |-
  سواره گرداگرد قلعه می‌چرخند و به هرکس بیرون دیوارها باشد تیراندازی می‌کنند. بقیه پیش می‌روند و به نیروهای سر راه تیراندازی می‌کنند.
jobs_fire_throwers: آتش‌اندازانِ سوزانندهٔ ساختمان‌ها (%)
jobs_fire_throwers_tooltip: |-
  بقیه پیش می‌روند و نیروهای دشمنِ سر راه را می‌سوزانند.
siege_group: ادوات محاصره در مسیر
siege_group_descr: |-
  منجنیق‌ها و بالیستاهای آتشینِ پایگاه مرزی مانند ادوات محاصرهٔ یورشی هوش مصنوعی، در مسیر خود به هدف‌هایی که از کنارشان می‌گذرند شلیک می‌کنند.
siege_enabled: شلیک به هدف‌های سر راه
siege_enabled_tooltip: |-
  منجنیق‌ها و بالیستاهای آتشینِ پایگاه مرزی به‌سوی قلعهٔ هدف حرکت می‌کنند و به‌محض این‌که یک ساختمان دشمن (برای بالیستاهای آتشین: ابتدا نیروهای دشمن) در بردشان قرار گیرد، می‌ایستند و شلیک می‌کنند. خود بازی با برد هر دستگاه تصمیم می‌گیرد چه چیزی در برد است، درست مانند ادوات محاصرهٔ بازیکن. فقط دشمنان هدف گرفته می‌شوند: بازیکنان تیمی غیر از مالک پایگاه و هرگز متحدان آن.
retarget_group: حریف بعدی
retarget_group_descr: |-
  واکنش نیروهای پایگاه مرزی پس از شکست خوردن بازیکنی که به او حمله می‌کردند.
retarget_enabled: حرکت به‌سوی حریف بعدی
retarget_enabled_tooltip: |-
  هر گروهی که پایگاه مرزی می‌فرستد، یک بازیکن دشمن را هدف می‌گیرد. پس از کشته شدن لرد آن بازیکن، گروه به‌جای بیکار ایستادن، حریف بعدی را به همان روشی انتخاب می‌کند که بازی هدف اول را برمی‌گزیند — نزدیک‌ترین دشمنی که لردش هنوز زنده است. ادوات محاصره از قبل به هر دشمنی در بردشان شلیک می‌کنند.
join_group: تقویت هوش مصنوعی توسط پایگاه‌های مرزی
join_group_descr: |-
  موج‌های خروجی از پایگاه‌های مرزی هوش مصنوعی به‌جای حملهٔ مستقل، به ارتش حملهٔ خود آن هوش مصنوعی می‌پیوندند.
join_enabled: ارسال موج‌های پایگاه به ارتش حملهٔ هوش مصنوعی
join_enabled_tooltip: |-
  وقتی موجی از پایگاه مرزی یک بازیکن هوش مصنوعی خارج می‌شود، نیروهایش به ارتش حملهٔ آن هوش مصنوعی می‌پیوندند و هر یک در همان دسته‌ای قرار می‌گیرند که خود بازی برایشان استفاده می‌کند: کمانداران، کمانداران زنبورکی، فلاخن‌اندازان، کمانداران سواره و آتش‌اندازان در نیروهای پشتیبانی و بقیه در ارتش اصلی. سپس منتظر حملهٔ بعدی هوش مصنوعی می‌مانند، در آن می‌جنگند و جزو شمار ارتشی حساب می‌شوند که هوش مصنوعی پیش از حمله منتظر تکمیلش می‌ماند. ادوات محاصره نزد پایگاه می‌مانند و به هدف‌های در برد شلیک می‌کنند. واحدی که هوش مصنوعی هنوز دستهٔ متناظر آن را ندارد، همچنان از پایگاه حمله می‌کند.
diagnostics_group: عیب‌یابی
diagnostics_group_descr: |-
  برای آزمایش.
diagnostics_log: ثبت عملکرد موج‌ها در فایل گزارش
diagnostics_log_tooltip: |-
  هر زمان موجی از پایگاه مرزی خارج شود و به وظایف تقسیم گردد، یک خط در ucp3.log می‌نویسد.
wave_rule: قاعدهٔ موج
wave_setting: تنظیم
wave_details: |-
  قواعد موج در دسترس سازندگان نقشه را پیکربندی کنید. اندازهٔ موج، تأخیر شروع و درصد رشد در صفحهٔ مهاجمانِ هر پایگاه مرزی ویرایش می‌شوند.
