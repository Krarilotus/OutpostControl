    contents:
      type: boolean
      value: false
    header: '{{jobs_enabled}}'
  - name: wave_job_shares
    display: Group
    table:
      rowHeader: '{{job_unit}}'
      columns:
      - name: share
        header: '{{job_share}}'
    children:
    - name: outpost-control-jobs-slaves_row
      display: GroupBox
      header: '{{jobs_slaves}}'
      children:
      - url: outpost-control.jobs.slaves
        name: outpost-control-jobs-slaves
        display: Slider
        contents:
          type: integer
          value: 50
          min: 0
          max: 100
          step: 5
        text: '{{jobs_slaves_tooltip}}'
        enabled: outpost-control.jobs.enabled
      columns: 1
    - name: outpost-control-jobs-spearmen_row
