options:
- display: GroupBox
  category: [Outpost Control]
  header: '{{defenders_group}}'
  text: '{{defenders_group_descr}}'
  hasHeader: true
  children:
  - url: outpost-control.defenders.enabled
    name: outpost-control-defenders-enabled
    text: '{{defenders_enabled}}'
    tooltip: '{{defenders_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

