options:
- display: GroupBox
  category:
  - '{{ai}}'
  - '{{improvements}}'
  header: '{{defenders_group}}'
  text: '{{defenders_group_descr}}'
  hasHeader: true
  children:
  - url: outpost-control.defenders.enabled
    name: outpost-control-defenders-enabled
    text: '{{defenders_enabled_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{defenders_enabled}}'
  - url: outpost-control.defenders.walls
    name: outpost-control-defenders-walls
    text: '{{defenders_walls_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{defenders_walls}}'
  - url: outpost-control.defenders.knights
    name: outpost-control-defenders-knights
    text: '{{defenders_knights_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{defenders_knights}}'
- display: GroupBox
  category:
  - '{{balance_changes}}'
  header: '{{waves_group}}'
  text: '{{wave_details}}'
  hasHeader: true
  children:
  - name: wave_rules
    display: Group
    table:
      rowHeader: '{{wave_rule}}'
      columns:
      - name: enabled
        header: '{{wave_setting}}'
    children:
    - name: outpost-control-waves-exact_row
      display: GroupBox
      header: '{{waves_exact}}'
      children:
      - url: outpost-control.waves.exact
        name: outpost-control-waves-exact
        text: '{{waves_exact_tooltip}}'
        display: UCP2Switch
        contents:
          type: boolean
          value: false
        header: '{{waves_exact}}'
      columns: 1
    - name: outpost-control-growth-enabled_row
      display: GroupBox
      header: '{{growth_enabled}}'
      children:
      - url: outpost-control.growth.enabled
        name: outpost-control-growth-enabled
        text: '{{growth_enabled_tooltip}}'
        display: UCP2Switch
        contents:
          type: boolean
          value: false
        header: '{{growth_enabled}}'
      columns: 1
- display: GroupBox
